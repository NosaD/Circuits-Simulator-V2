<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no"/>
  <title>Circuit Sim V0.1</title>
  <link rel="stylesheet" href="src/style.css">
</head>
<body>
<div id="toolbar">
  <div class="tb-row">
    <button id="btn-R" onclick="startAdd('R')">＋ R</button>
    <button id="btn-C" onclick="startAdd('C')">＋ C</button>
    <button id="btn-L" onclick="startAdd('L')">＋ Inductor</button>
    <button id="btn-VS" onclick="startAdd('VS')">＋ V Source</button>
    <button id="btn-D" onclick="startAdd('D')">＋ Diode</button>
  </div>
  <div class="tb-row">
    <button id="run-btn" onclick="runSim()">▶ Run Sim</button>
    <button id="clear-btn" onclick="clearCircuit()">✕ Clear</button>
  </div>
</div>

<div id="canvas-wrap">
  <canvas id="schematic"></canvas>
  <div id="edit-panel">
    <h3 id="ep-title">Component</h3>
    <label id="ep-label">Value</label>
    <input id="ep-input" type="text" inputmode="decimal"/>
    <div class="ep-btns">
      <button id="ep-apply" onclick="applyEdit()">Apply</button>
      <button id="ep-delete" onclick="deleteSelected()">Delete</button>
      <button id="ep-close" onclick="closeEdit()">✕</button>
    </div>
  </div>
</div>

<div id="msg-bar" class="info">Loading…</div>

<script type="module">
import './src/ui.js';
window.addEventListener('load', () => {
  loadDemo();
  resize();
  msg('Demo loaded. Tap ▶ Run Sim.', 'info');
});
</script>
</body>
</html>
